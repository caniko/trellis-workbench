[flake]
scope = "hooks-only"

[ci]
provider = "actions"
platform = "github"
runtime = "nix"
runner = "ubuntu-24.04"
nix_builds = [
  ".#packages.x86_64-linux.trellis-workbench",
  ".#packages.x86_64-linux.trellis-workbench-blender-addon",
  ".#checks.x86_64-linux.blender",
]

[prebuild]
publish_attic = true
attic_app = ".#push-flake-inputs"
system_runners = { x86_64-linux = "ubuntu-24.04" }

[release.github]
repo = "caniko/trellis-workbench"
target_branch = "trunk"

[release.artifacts]
runner = "ubuntu-24.04"
substituters = ["https://attic.candee.baby/canix", "https://cache.nixos.org"]
trusted_public_keys = [
  "canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8=",
  "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=",
]

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "trellis-workbench"
token_secret = "ATTIC_TOKEN"
