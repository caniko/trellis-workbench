# Generated by simit. Manual edits will be reported as ci=drift.
name: Nix installable builds

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-groups-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.ref_type == 'tag' && github.ref || format('refs/heads/{0}', github.event.pull_request.head.ref || github.ref_name) }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - group: "blender"
            installables: '[".#checks.x86_64-linux.blender",".#packages.x86_64-linux.trellis-workbench-blender-addon"]'
          - group: "python"
            installables: '[".#checks.x86_64-linux.trellis-workbench"]'
          - group: "static"
            installables: '[".#checks.x86_64-linux.formatting",".#checks.x86_64-linux.lint",".#checks.x86_64-linux.torch-wheels-are-pinned-variants",".#checks.x86_64-linux.cache-pin-wheel-pins-rocm-coverage",".#checks.x86_64-linux.cache-pin-wheel-pins-xpu-coverage"]'
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare Nix build evidence
        run: |
          SIMIT_NIX_BUILD_RESULTS="$RUNNER_TEMP/simit-nix-build-${{ strategy.job-index }}"
          mkdir -p "$SIMIT_NIX_BUILD_RESULTS"
          printf '%s\n' "SIMIT_NIX_BUILD_RESULTS=$SIMIT_NIX_BUILD_RESULTS" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$SIMIT_NIX_BUILD_RESULTS/revision"
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://attic.candee.baby/canix https://cache.nixos.org
            trusted-public-keys = canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Provision grouped-build Rust engine
        shell: bash
        env:
          SIMIT_CI_ENGINE_REVISION: ${{ vars.SIMIT_CI_ENGINE_REVISION }}
          BASH_ENV: ''
          ENV: ''
          NIX_CONFIG: 'experimental-features = nix-command flakes'
          NIX_USER_CONF_FILES: /dev/null
          NIX_PATH: ''
        run: |
          [[ "$SIMIT_CI_ENGINE_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Enroll an immutable SIMIT_CI_ENGINE_REVISION containing ci nix-group' >&2; exit 1; }
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64|Linux:aarch64|Linux:arm64|Darwin:arm64|Darwin:aarch64) ;;
            *) echo 'unsupported grouped engine runner system' >&2; exit 1 ;;
          esac
          engine_path=$(env -u GH_TOKEN -u GITHUB_TOKEN -u GITHUB_OAUTH_TOKEN -u ATTIC_TOKEN -u CACHIX_AUTH_TOKEN -u CACHIX_SIGNING_KEY nix build --no-link --no-update-lock-file --print-out-paths --option accept-flake-config false --option access-tokens '' --option substituters https://cache.nixos.org "github:caniko/simit/$SIMIT_CI_ENGINE_REVISION#default")
          [[ "$engine_path" =~ ^/nix/store/[0-9a-z]{32}-[A-Za-z0-9+._?=-]+$ ]] || { echo 'Invalid engine output inventory' >&2; exit 1; }
          test -x "$engine_path/bin/simit"
          "$engine_path/bin/simit" ci nix-group --help > /dev/null
          printf '%s\n' "$SIMIT_CI_ENGINE_REVISION" > "$SIMIT_NIX_BUILD_RESULTS/engine-source-revision"
          engine_digest=$(nix hash file --type sha256 --base16 "$engine_path/bin/simit")
          printf '%s  %s\n' "$engine_digest" "$engine_path/bin/simit" > "$SIMIT_NIX_BUILD_RESULTS/engine-executable.sha256"
          printf '%s\n' "SIMIT_CI_ENGINE=$engine_path/bin/simit" >> "$GITHUB_ENV"
      - name: Build Nix group
        shell: bash
        env:
          SIMIT_NIX_GROUP: ${{ matrix.group }}
        run: |
          case "$SIMIT_NIX_GROUP" in
            blender)
              (umask 077; set -C; printf '%s' '{"schema":"simit.nix-group-spec.v1","members":[".#checks.x86_64-linux.blender",".#packages.x86_64-linux.trellis-workbench-blender-addon"],"plan":[".#checks.x86_64-linux.formatting",".#checks.x86_64-linux.lint",".#checks.x86_64-linux.torch-wheels-are-pinned-variants",".#checks.x86_64-linux.cache-pin-wheel-pins-rocm-coverage",".#checks.x86_64-linux.cache-pin-wheel-pins-xpu-coverage",".#checks.x86_64-linux.trellis-workbench",".#checks.x86_64-linux.blender",".#packages.x86_64-linux.trellis-workbench-blender-addon"],"check_systems":["x86_64-linux"],"limits":["--max-jobs","1","--cores","2"],"post_build":[],"post_build_always":[],"fresh_installables":[]}' > "$SIMIT_NIX_BUILD_RESULTS/group-spec.json")
              ;;
            python)
              (umask 077; set -C; printf '%s' '{"schema":"simit.nix-group-spec.v1","members":[".#checks.x86_64-linux.trellis-workbench"],"plan":[".#checks.x86_64-linux.formatting",".#checks.x86_64-linux.lint",".#checks.x86_64-linux.torch-wheels-are-pinned-variants",".#checks.x86_64-linux.cache-pin-wheel-pins-rocm-coverage",".#checks.x86_64-linux.cache-pin-wheel-pins-xpu-coverage",".#checks.x86_64-linux.trellis-workbench",".#checks.x86_64-linux.blender",".#packages.x86_64-linux.trellis-workbench-blender-addon"],"check_systems":["x86_64-linux"],"limits":["--max-jobs","1","--cores","2"],"post_build":[],"post_build_always":[],"fresh_installables":[]}' > "$SIMIT_NIX_BUILD_RESULTS/group-spec.json")
              ;;
            static)
              (umask 077; set -C; printf '%s' '{"schema":"simit.nix-group-spec.v1","members":[".#checks.x86_64-linux.formatting",".#checks.x86_64-linux.lint",".#checks.x86_64-linux.torch-wheels-are-pinned-variants",".#checks.x86_64-linux.cache-pin-wheel-pins-rocm-coverage",".#checks.x86_64-linux.cache-pin-wheel-pins-xpu-coverage"],"plan":[".#checks.x86_64-linux.formatting",".#checks.x86_64-linux.lint",".#checks.x86_64-linux.torch-wheels-are-pinned-variants",".#checks.x86_64-linux.cache-pin-wheel-pins-rocm-coverage",".#checks.x86_64-linux.cache-pin-wheel-pins-xpu-coverage",".#checks.x86_64-linux.trellis-workbench",".#checks.x86_64-linux.blender",".#packages.x86_64-linux.trellis-workbench-blender-addon"],"check_systems":["x86_64-linux"],"limits":["--max-jobs","1","--cores","2"],"post_build":[],"post_build_always":[],"fresh_installables":[]}' > "$SIMIT_NIX_BUILD_RESULTS/group-spec.json")
              ;;
            *) echo 'Unknown Nix execution group' >&2; exit 1 ;;
          esac
          "$SIMIT_CI_ENGINE" ci nix-group --spec "$SIMIT_NIX_BUILD_RESULTS/group-spec.json"
      - name: Upload Nix build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2

        with:
          name: nix-build-${{ strategy.job-index }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/simit-nix-build-${{ strategy.job-index }}
